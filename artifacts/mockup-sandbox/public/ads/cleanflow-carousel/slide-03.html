<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleanFlow Platform — الأسطول والفرق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #102d37; font-family: "IBM Plex Sans Arabic", sans-serif; -webkit-font-smoothing: antialiased; }
    .poster {
      width: 100vw; height: 100vh; position: relative; overflow: hidden; isolation: isolate;
      color: #faf7ef; background: #102d37;
    }
    .photo { position: absolute; z-index: -3; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .shade {
      position: absolute; z-index: -2; inset: 0;
      background:
        linear-gradient(180deg, rgba(9, 31, 43, .38) 0%, rgba(10, 35, 45, .16) 34%, rgba(8, 32, 40, .08) 52%, rgba(9, 34, 42, .58) 68%, rgba(8, 31, 39, .95) 100%),
        linear-gradient(90deg, rgba(11, 35, 46, .38), transparent 82%);
    }
    .topline { position: absolute; top: 5.2%; left: 6.2%; right: 6.2%; display: flex; align-items: flex-start; justify-content: space-between; direction: ltr; }
    .brand { display: flex; align-items: center; gap: clamp(8px, 1.2vw, 14px); direction: ltr; }
    .brand-mark {
      width: clamp(37px, 5.2vw, 57px); height: clamp(37px, 5.2vw, 57px);
      border-radius: 13px; display: grid; place-items: center; color: #fff8ef; background: #e46942;
      transform: rotate(-7deg); box-shadow: 0 8px 24px rgba(8, 22, 27, .26);
    }
    .brand-mark svg { width: 58%; height: 58%; transform: rotate(7deg); }
    .brand-word { display: flex; flex-direction: column; line-height: 1.04; text-align: left; }
    .brand-word strong { font-family: "Space Mono", monospace; font-size: clamp(14px, 2vw, 22px); letter-spacing: -.075em; color: #faf7ef; }
    .brand-word small { margin-top: 5px; color: #f0a080; text-transform: uppercase; letter-spacing: .16em; font: 700 clamp(8px, 1vw, 11px)/1 "Space Mono", monospace; }
    .slide-count { color: rgba(250,247,239,.9); font: 700 clamp(12px, 1.65vw, 18px)/1 "Space Mono", monospace; letter-spacing: .04em; padding-top: 8px; }
    .slide-count::after { content: ""; display: block; height: 2px; width: 100%; margin-top: 9px; background: #e46942; }
    .headline {
      position: absolute; top: 21.6%; right: 7%; width: 86%;
      margin: 0; text-align: right; direction: rtl; font-weight: 700;
      font-size: clamp(36px, 7.4vw, 82px); line-height: 1.22; letter-spacing: -.045em;
      text-shadow: 0 3px 24px rgba(4, 19, 27, .32);
    }
    .headline .accent { color: #ef916c; white-space: nowrap; }
    .headline::before {
      content: ""; position: absolute; right: 0; top: -19px; width: clamp(34px, 4.3vw, 47px); height: 4px;
      background: #e46942; border-radius: 9px;
    }
    .feature-row {
      position: absolute; top: 70%; left: 6.2%; right: 6.2%;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(9px, 1.5vw, 17px);
      direction: rtl;
    }
    .feature {
      min-height: clamp(98px, 15.3vw, 165px); padding: clamp(12px, 2vw, 22px) clamp(8px, 1.4vw, 16px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(9px, 1.4vw, 16px);
      text-align: center; background: rgba(15, 53, 59, .77); border: 1px solid rgba(250, 247, 239, .22);
      border-radius: clamp(12px, 1.9vw, 21px); backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(4, 20, 27, .16);
    }
    .feature:nth-child(2) { transform: translateY(-10px); }
    .feature-icon {
      width: clamp(34px, 4.9vw, 53px); height: clamp(34px, 4.9vw, 53px); display: grid; place-items: center;
      border-radius: 50%; color: #f0a080; background: rgba(228, 105, 66, .14); border: 1px solid rgba(228, 105, 66, .46);
    }
    .feature-icon svg { width: 56%; height: 56%; }
    .feature-label { font-size: clamp(14px, 2.5vw, 27px); line-height: 1.35; font-weight: 600; color: #faf7ef; white-space: nowrap; }
    .bottom {
      position: absolute; bottom: 5.2%; left: 6.2%; right: 6.2%;
      display: flex; align-items: center; justify-content: space-between; direction: rtl;
    }
    .cta {
      min-height: clamp(46px, 6.8vw, 72px); padding: 0 clamp(18px, 3vw, 33px);
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      border-radius: 999px; color: #fff8ef; background: #e46942;
      font-size: clamp(16px, 2.4vw, 26px); font-weight: 700;
      box-shadow: 0 9px 24px rgba(153, 64, 39, .22);
    }
    .cta svg { width: clamp(17px, 2.2vw, 24px); height: clamp(17px, 2.2vw, 24px); }
    .bottom-note { direction: ltr; font: 400 clamp(9px, 1.2vw, 13px)/1 "Space Mono", monospace; letter-spacing: .08em; color: rgba(250,247,239,.68); }
    @media (max-width: 520px) {
      .headline { top: 23%; font-size: clamp(31px, 8.2vw, 43px); width: 88%; }
      .feature-row { top: 70%; gap: 7px; }
      .feature { min-height: 96px; padding: 9px 3px; border-radius: 12px; }
      .feature-label { font-size: clamp(11px, 3.05vw, 15px); }
      .feature-icon { width: 33px; height: 33px; }
      .feature:nth-child(2) { transform: translateY(-7px); }
      .bottom { bottom: 5%; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="CleanFlow Platform — الأسطول والفرق">
    <img class="photo" src="./media/slide-03-fleet.jpg" alt="أسطول شاحنات وحاويات في ساحة تشغيل عند الغروب">
    <div class="shade" aria-hidden="true"></div>
    <header class="topline">
      <div class="brand" aria-label="CleanFlow Platform">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.4"></rect><rect x="14" y="14" width="7" height="7" rx="1.4"></rect>
            <path d="M7 10v4a3 3 0 0 0 3 3h4M17 14v-4a3 3 0 0 0-3-3h-4"></path>
          </svg>
        </span>
        <span class="brand-word"><strong>CleanFlow</strong><small>Platform</small></span>
      </div>
      <span class="slide-count">3/5</span>
    </header>
    <h1 class="headline">أسطولك وفريقك<br><span class="accent">في المسار الصحيح.</span></h1>
    <section class="feature-row" aria-label="مزايا إدارة الأسطول والفرق">
      <article class="feature">
        <span class="feature-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M8 14h3M8 17h7"></path></svg>
        </span>
        <span class="feature-label">جدولة الفرق</span>
      </article>
      <article class="feature">
        <span class="feature-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h8M8 9h1"></path></svg>
        </span>
        <span class="feature-label">أوامر عمل ميدانية</span>
      </article>
      <article class="feature">
        <span class="feature-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"></path><path d="m9 12 2 2 4-4"></path></svg>
        </span>
        <span class="feature-label">متابعة التنفيذ</span>
      </article>
    </section>
    <footer class="bottom">
      <div class="cta">شاهد النظام
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg>
      </div>
      <span class="bottom-note">CLEANFLOW · PLATFORM</span>
    </footer>
  </main>
</body>
</html>
