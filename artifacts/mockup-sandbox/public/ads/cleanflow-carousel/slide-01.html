<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#153c3c" />
    <title>CleanFlow Platform — 1/5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --teal: #153c3c;
        --coral: #e46942;
        --ivory: #faf7ef;
      }

      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--teal);
      }
      body {
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        display: grid;
        width: 100vw;
        height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: var(--teal);
      }
      .poster {
        container-type: inline-size;
        position: relative;
        width: min(100vw, 80dvh);
        aspect-ratio: 4 / 5;
        overflow: hidden;
        isolation: isolate;
        background: #102d35;
        color: var(--ivory);
      }
      .hero-photo {
        position: absolute;
        z-index: -3;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }
      .grade {
        position: absolute;
        z-index: -2;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(8, 27, 40, .57) 0%, rgba(9, 32, 43, .30) 34%, rgba(12, 33, 38, .08) 53%, rgba(8, 24, 32, .22) 70%, rgba(7, 24, 34, .86) 100%),
          linear-gradient(90deg, rgba(10, 31, 42, .18), transparent 60%);
      }
      .topline {
        position: absolute;
        top: 5.2%;
        right: 7.4%;
        left: 7.4%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        direction: ltr;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        direction: ltr;
      }
      .brand-symbol {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        transform: rotate(-7deg);
        border-radius: 13px;
        background: var(--coral);
        color: var(--ivory);
        box-shadow: 0 8px 24px rgba(4, 24, 32, .24);
      }
      .brand-symbol svg { width: 27px; height: 27px; }
      .brand-name {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1;
      }
      .brand-name strong {
        color: var(--ivory);
        font-family: "Space Mono", monospace;
        font-size: clamp(14px, 3.1cqw, 21px);
        font-weight: 700;
        letter-spacing: -.07em;
      }
      .brand-name small {
        margin-top: 5px;
        color: #f0a083;
        font-family: "Space Mono", monospace;
        font-size: clamp(8px, 1.65cqw, 11px);
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      .carousel-count {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
        color: rgba(250, 247, 239, .94);
        font-family: "Space Mono", monospace;
        font-size: clamp(12px, 2.5cqw, 17px);
        font-weight: 700;
        letter-spacing: .025em;
        direction: ltr;
      }
      .carousel-count::after {
        width: 28px;
        height: 2px;
        content: "";
        background: var(--coral);
      }
      .copy {
        position: absolute;
        top: 18.2%;
        right: 8%;
        left: 8%;
        text-align: right;
        direction: rtl;
      }
      .headline {
        margin: 0;
        color: var(--ivory);
        font-size: clamp(38px, 7.1cqw, 78px);
        font-weight: 700;
        letter-spacing: -.055em;
        line-height: 1.23;
        text-wrap: balance;
        text-shadow: 0 3px 24px rgba(5, 20, 29, .25);
      }
      .headline span { display: block; }
      .headline .accent { color: #f08a64; }
      .support {
        max-width: 86%;
        margin: 3.1% 0 0 auto;
        color: rgba(250, 247, 239, .94);
        font-size: clamp(17px, 3.2cqw, 29px);
        font-weight: 500;
        line-height: 1.65;
        text-wrap: pretty;
        text-shadow: 0 2px 14px rgba(5, 20, 29, .56);
      }
      .cta {
        position: absolute;
        right: 8%;
        bottom: 9.1%;
        display: inline-flex;
        min-height: 7.3%;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 26px;
        border: 1px solid rgba(255, 226, 211, .36);
        border-radius: 999px;
        background: var(--coral);
        color: var(--ivory);
        box-shadow: 0 13px 32px rgba(7, 23, 32, .35);
        font-size: clamp(16px, 3.25cqw, 28px);
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      .cta svg {
        width: clamp(17px, 2.5cqw, 23px);
        height: clamp(17px, 2.5cqw, 23px);
        flex: none;
      }
      .progress {
        position: absolute;
        right: 8%;
        bottom: 4.6%;
        left: 8%;
        display: flex;
        gap: 7px;
        direction: ltr;
      }
      .progress span {
        height: 3px;
        flex: 1;
        border-radius: 9px;
        background: rgba(250, 247, 239, .32);
      }
      .progress span:first-child { background: var(--coral); }

      @media (max-width: 520px) {
        .brand-symbol { width: 39px; height: 39px; border-radius: 11px; }
        .brand-symbol svg { width: 23px; height: 23px; }
        .brand { gap: 9px; }
        .headline { font-size: clamp(35px, 8.4cqw, 45px); }
        .support { max-width: 95%; font-size: clamp(16px, 4.2cqw, 20px); }
        .cta { min-height: 8%; padding-inline: 19px; font-size: clamp(15px, 4.1cqw, 19px); }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="CleanFlow Platform — الشريحة 1 من 5">
      <article class="poster">
        <img class="hero-photo" src="media/slide-01-hero.jpg" alt="شاحنة رافعة وحاوية في موقع إنشاء بالرياض" />
        <div class="grade" aria-hidden="true"></div>

        <header class="topline">
          <div class="carousel-count" aria-label="الشريحة 1 من 5">1/5</div>
          <div class="brand" aria-label="CleanFlow Platform">
            <span class="brand-symbol" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="6" height="6" rx="1" />
                <rect x="15" y="15" width="6" height="6" rx="1" />
                <path d="M21 3h-6v6" />
                <path d="M21 9a9 9 0 0 1-9 9" />
                <path d="M3 21v-6h6" />
                <path d="M3 15a9 9 0 0 1 9-9" />
              </svg>
            </span>
            <span class="brand-name">
              <strong>CleanFlow</strong>
              <small>Platform</small>
            </span>
          </div>
        </header>

        <section class="copy" dir="rtl">
          <h1 class="headline">
            <span>النظام الذكي</span>
            <span>لإدارة تأجير</span>
            <span class="accent">الحاويات</span>
          </h1>
          <p class="support">طلباتك، أسطولك، عقودك وفواتيرك في منصة واحدة.</p>
        </section>

        <div class="cta" dir="rtl">
          <span>اطلب عرضًا تجريبيًا</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" />
            <path d="m12 19-7-7 7-7" />
          </svg>
        </div>
        <div class="progress" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </article>
    </main>
  </body>
</html>
