<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanFlow Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family: "IBM Plex Sans Arabic", sans-serif;
      }

      .ad {
        width: 100vw;
        height: 100vh;
        padding: 7vh 7vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        background: #faf7ef;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 1.1vw;
        align-self: flex-start;
        direction: ltr;
      }

      .brand-symbol {
        width: 5.4vh;
        height: 5.4vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        border-radius: 1.35vh;
        background: #e46942;
      }

      .brand-symbol svg {
        width: 2.6vh;
        height: 2.6vh;
        stroke: #faf7ef;
        stroke-width: 2.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .brand-name {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        color: #153c3c;
        line-height: 1.04;
      }

      .brand-name strong {
        font-family: "IBM Plex Sans Arabic", sans-serif;
        font-size: 2.6vh;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .brand-name small {
        margin-top: 0.28vh;
        font-size: 1.35vh;
        font-weight: 500;
        letter-spacing: 0.03em;
      }

      .middle {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2.65vh;
        margin-bottom: 5vh;
        color: #153c3c;
      }

      .headline {
        max-width: 86vw;
        font-size: 7.5vw;
        font-weight: 700;
        line-height: 1.26;
        letter-spacing: -0.045em;
        text-align: left;
        text-wrap: balance;
      }

      .benefit {
        max-width: 84vw;
        color: #153c3c;
        font-size: 3.35vw;
        font-weight: 400;
        line-height: 1.65;
        text-align: left;
      }

      .cta {
        display: inline-flex;
        min-height: 7.2vh;
        align-items: center;
        justify-content: center;
        margin-top: 1vh;
        padding: 0 4vw;
        border-radius: 1.2vh;
        background: #e46942;
        color: #faf7ef;
        font-size: 3.3vw;
        font-weight: 700;
        line-height: 1;
        text-align: left;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="ad">
      <div class="logo" aria-label="CleanFlow Platform">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="6" height="6" rx="2"></rect>
            <rect x="15" y="15" width="6" height="6" rx="2"></rect>
            <path d="M6 9v6a2 2 0 0 0 2 2h6"></path>
            <path d="M9 6h6a2 2 0 0 1 2 2v1"></path>
          </svg>
        </span>
        <span class="brand-name">
          <strong>CleanFlow</strong>
          <small>Platform</small>
        </span>
      </div>
      <section class="middle">
        <div class="headline" dir="rtl">أسطولك ومواعيدك في لوحة واحدة</div>
        <div class="benefit" dir="rtl">جدولة الفرق، أوامر العمل، ومتابعة التنفيذ</div>
        <div class="cta" dir="rtl">شاهد المنصة</div>
      </section>
    </main>
  </body>
</html>
