<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanFlow Platform — عقودك وفواتيرك أوضح</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family: "IBM Plex Sans Arabic", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .ad {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 7vh 7vw;
        background: #153c3c;
        color: #faf7ef;
      }

      .logo {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        align-self: flex-start;
        gap: 1.5vw;
        direction: ltr;
        white-space: nowrap;
      }

      .brand-symbol {
        display: grid;
        width: 5.4vh;
        height: 5.4vh;
        place-items: center;
        border-radius: 1.35vh;
        background: #e46942;
      }

      .brand-symbol svg {
        width: 2.8vh;
        height: 2.8vh;
        color: #faf7ef;
      }

      .brand-name {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.05vh;
        line-height: 1.05;
        font-family: "IBM Plex Sans Arabic", sans-serif;
      }

      .brand-name strong {
        color: #faf7ef;
        font-size: 3.25vw;
        font-weight: 700;
        letter-spacing: -0.055vw;
      }

      .brand-name small {
        color: #faf7ef;
        font-size: 1.9vw;
        font-weight: 500;
        letter-spacing: 0.08vw;
      }

      .middle {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 3vh;
        direction: rtl;
        text-align: left;
      }

      .headline {
        max-width: 100%;
        color: #faf7ef;
        font-size: 8.2vw;
        font-weight: 700;
        line-height: 1.28;
        letter-spacing: -0.12vw;
        text-wrap: balance;
      }

      .benefit {
        max-width: 100%;
        color: #faf7ef;
        font-size: 3.35vw;
        font-weight: 400;
        line-height: 1.65;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 7.4vh;
        padding: 1.65vh 4vw;
        border-radius: 1.1vh;
        background: #e46942;
        color: #153c3c;
        font-size: 3.2vw;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="ad" aria-label="إعلان CleanFlow Platform">
      <div class="logo" aria-label="CleanFlow Platform">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="6" r="2.5"></circle>
            <circle cx="19" cy="18" r="2.5"></circle>
            <path d="M7.5 6h5a4 4 0 0 1 4 4v5.5"></path>
            <path d="M5 8.5v7a2.5 2.5 0 0 0 2.5 2.5H16.5"></path>
          </svg>
        </span>
        <span class="brand-name">
          <strong>CleanFlow</strong>
          <small>Platform</small>
        </span>
      </div>
      <section class="middle">
        <div class="headline" lang="ar" dir="rtl">عقودك وفواتيرك أوضح</div>
        <div class="benefit" lang="ar" dir="rtl">تابع الاستحقاقات واضبط أسعار الباقات</div>
        <div class="cta" lang="ar" dir="rtl">احجز عرضًا عمليًا</div>
      </section>
    </main>
  </body>
</html>
