    <!-- Vite serves this document for every SPA route in development. Keep
         the hero preload conditional so admin pages do not fetch a homepage
         image they never render. The homepage prerender replaces this helper
         with a static preload for the actual first active slide. -->
    <script id="conditional-lcp-preload">
      if (window.location.pathname === "/" || window.location.pathname === "") {
        const heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = "/images/container-large.png";
        heroPreload.fetchPriority = "high";
        heroPreload.imageSizes = "100vw";
        heroPreload.dataset.lcpHero = "true";
        document.head.appendChild(heroPreload);
      }
    </script>
